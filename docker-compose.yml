services:
  # Relational Database: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: sentineldlp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sentineldlp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-internal
    # For local security, do not expose PostgreSQL publicly to external networks;
    # bind strictly to localhost for direct administrative tool access if needed:
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentineldlp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API: FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentineldlp-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD:-sentinel_secure_dev_password}@db:5432/${POSTGRES_DB:-sentineldlp}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "8000:8000"
    networks:
      - sentinel-internal
    volumes:
      - ./sample_data:/data/samples:ro
    depends_on:
      db:
        condition: service_healthy

  # Frontend: React + TypeScript + Vite (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentineldlp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - sentinel-internal
    depends_on:
      - backend

networks:
  sentinel-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
