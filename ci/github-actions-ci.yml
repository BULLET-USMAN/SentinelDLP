name: SentinelDLP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Test Suite & Security Regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Syntax & Import Checks
        run: |
          python -m compileall backend/app

      - name: Execute Full Pytest Regression Suite
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite:///:memory:
          AUTH_ENABLED: "true"
          AUTH_ENFORCED: "false"
        run: |
          python -m pytest -v backend/tests --tb=short

  frontend-build:
    name: Frontend TypeScript Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Execute TypeScript Compiler & Vite Production Build
        working-directory: frontend
        run: npm run build

  docker-lint:
    name: Docker Compose & Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config
